<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Book Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="page narrow">
    <section class="toolbar">
        <div>
            <p class="eyebrow">Book Details</p>
            <h1 th:text="${pageTitle}">Add Book</h1>
        </div>
        <a class="button muted" th:href="@{/books}">Back</a>
    </section>

    <form class="book-form" method="post" th:action="@{/books}" th:object="${book}">
        <input type="hidden" th:field="*{id}">

        <label>
            <span>Title</span>
            <input type="text" th:field="*{title}" placeholder="Enter book title">
            <small class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
        </label>

        <label>
            <span>Author</span>
            <input type="text" th:field="*{author}" placeholder="Enter author name">
            <small class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></small>
        </label>

        <label>
            <span>ISBN</span>
            <input type="text" th:field="*{isbn}" placeholder="Enter ISBN">
            <small class="error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></small>
        </label>

        <label>
            <span>Copies Available</span>
            <input type="number" min="0" th:field="*{copiesAvailable}">
            <small class="error" th:if="${#fields.hasErrors('copiesAvailable')}" th:errors="*{copiesAvailable}"></small>
        </label>

        <div class="form-actions">
            <button class="button primary" type="submit">Save Book</button>
            <a class="button muted" th:href="@{/books}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
